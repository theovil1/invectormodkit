<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invector Chart Editor</title>
  <script type="importmap">{ "imports": { "three": "./vendor/three/three.module.min.js" } }</script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="backdrop"></div>

  <!-- Top: the game's logo, file actions as the game's menu buttons, the game's difficulty selector -->
  <header id="top">
    <div class="brand"><img id="logo" alt=""><span class="name" data-t="appName"></span></div>
    <div class="group files">
      <button id="btn-open" class="gbtn" data-t="open"></button>
      <button id="btn-new" class="gbtn" data-t="new"></button>
      <button id="btn-save" class="gbtn" data-t="save"></button>
      <button id="btn-send" class="gbtn accent" data-t="sendToGame"></button>
      <button id="btn-publish" class="gbtn" data-t="publish"></button>
    </div>
    <div id="difficulty" class="difficulty"></div>
    <div class="group right">
      <span id="account" class="muted"></span>
      <button id="btn-settings" class="icon" title="">⚙</button>
    </div>
  </header>

  <main id="studio">
    <!-- Left: the song, its difficulties, the selection, tools, playability -->
    <aside id="side">
      <section class="frame" id="card-song">
        <h2 data-t="song"></h2>
        <label class="field"><span data-t="title"></span><input id="f-title" type="text"></label>
        <label class="field"><span data-t="artist"></span><input id="f-artist" type="text"></label>
        <div class="row">
          <label class="field"><span>BPM</span><input id="f-bpm" type="number" step="0.01" min="20" max="400"></label>
          <button id="btn-tap" data-t="tap"></button>
        </div>
        <div class="row">
          <label class="field"><span data-t="firstBeat"></span><input id="f-first" type="number" step="0.001"></label>
          <button id="btn-first-minus" class="icon" title="−5 ms">−5</button><button id="btn-first-plus" class="icon" title="+5 ms">+5</button>
        </div>
        <div class="row three">
          <label class="field"><span data-t="start"></span><input id="f-start" type="number" step="0.01"></label>
          <label class="field"><span data-t="end"></span><input id="f-end" type="number" step="0.01"></label>
          <label class="field"><span data-t="preview"></span><input id="f-preview" type="number" step="0.01"></label>
        </div>
      </section>
      <section class="frame" id="card-difficulties"><h2 data-t="difficulties"></h2><div id="difficulties"></div></section>
      <section class="frame" id="card-selection"></section>
      <section class="frame" id="card-tools"></section>
      <section class="frame" id="card-issues"><h2 id="issues-title"></h2><ol id="issues"></ol></section>
    </aside>

    <!-- Right: the game-like 3D preview in the game's HUD corners, the transport under it -->
    <section id="stage">
      <div id="preview-wrap">
        <canvas id="preview"></canvas>
        <div class="hud tl"></div><div class="hud tr"></div><div class="hud bl"></div><div class="hud br"></div>
        <div class="hud-label"><span data-t="previewTitle"></span> · <span id="zone-name"></span></div>
        <div id="clock" class="hud-clock">0:00.000</div>
        <p id="preview-hint" class="hud-hint hidden"></p>
      </div>
      <nav id="transport">
        <button id="btn-play" class="icon big" title="">▶</button>
        <label><span data-t="speed"></span>
          <select id="speed"><option value="1">100 %</option><option value="0.75">75 %</option><option value="0.5">50 %</option><option value="0.25">25 %</option></select>
        </label>
        <label class="toggle"><input type="checkbox" id="claps" checked><span data-t="claps"></span></label>
        <label class="toggle"><input type="checkbox" id="metronome"><span data-t="metronome"></span></label>
        <label class="toggle"><input type="checkbox" id="follow" checked><span data-t="follow"></span></label>
        <label><span data-t="grid"></span>
          <select id="division">
            <option value="1" data-t="grid1"></option><option value="2" data-t="grid2"></option><option value="3" data-t="grid3"></option>
            <option value="4" selected data-t="grid4"></option><option value="6" data-t="grid6"></option><option value="8" data-t="grid8"></option>
          </select>
        </label>
        <label><span data-t="ghost"></span><select id="ghost"></select></label>
        <span class="spacer"></span>
        <button id="btn-zoom-out" class="icon">−</button>
        <button id="btn-zoom-in" class="icon">+</button>
      </nav>
    </section>
  </main>

  <!-- Bottom: the timeline -->
  <section id="timeline-wrap" class="frame">
    <div id="timeline-box"><canvas id="timeline"></canvas></div>
    <div id="empty" class="empty"><p data-t="emptyHint"></p><button id="btn-open-2" class="gbtn accent" data-t="open"></button></div>
  </section>

  <!-- The game's key hints bar, the legend, the status -->
  <footer id="keybar">
    <span class="key" data-keys="Keyboard_Space" data-label="kbPlay"></span>
    <span class="key" data-keys="Keyboard_Alpha1 Keyboard_Alpha6" data-label="kbButton"></span>
    <span class="key" data-keys="Keyboard_S" data-label="strum"></span>
    <span class="key" data-keys="Keyboard_LeftControl Keyboard_Z" data-label="kbUndo"></span>
    <span class="key" data-keys="Keyboard_T" data-label="kbTempo"></span>
    <span class="key" data-keys="Keyboard_Tab" data-label="kbDifficulty"></span>
    <span class="key" data-keys="Keyboard_Plus Keyboard_Minus" data-label="kbZoom"></span>
    <span id="status-text"></span>
    <span class="spacer"></span>
    <span id="status-info" class="muted"></span>
    <span id="legend" class="legend"></span>
  </footer>

  <div id="modal" class="modal hidden"><div class="box frame" id="modal-box"></div></div>
  <div id="menu" class="menu hidden"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
